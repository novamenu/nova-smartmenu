<title>NOVA GRILL</title><style>

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:100;padding:16px;align-items:flex-end;justify-content:center}
.sheet{background:#171719;border:1px solid #38383c;border-radius:22px;width:min(100%,650px);padding:16px;max-height:90vh;overflow:auto}.sheet img{width:100%;height:230px;object-fit:cover;border-radius:15px}

.rtl{direction:rtl;text-align:right}

{id:"steak",cat:"grill",name:"NOVA Steak",price:"€24,95",img:"https://images.unsplash.com/photo-1600891964092-4316c288032e?auto=format&fit=crop&w=600&q=80",d:{nl:"Gegrilde steak met kruidenboter, friet en salade.",en:"Grilled steak with herb butter, fries and salad.",fr:"Steak grillé avec beurre aux herbes, frites et salade.",ar:"ستيك مشوي مع زبدة الأعشاب والبطاطس والسلطة."}},

{id:"cola",cat:"drink",name:"Coca-Cola",price:"€3,25",img:"https://images.unsplash.com/photo-1629203851122-3726ecdf080e?auto=format&fit=crop&w=600&q=80",d:{nl:"IJskoude Coca-Cola.",en:"Ice-cold Coca-Cola.",fr:"Coca-Cola bien frais.",ar:"كوكا كولا باردة."}},
{id:"water",cat:"drink",name:"Spa Blauw",price:"€2,75",img:"https://images.unsplash.com/photo-1548839140-29a749e1cf4d?auto=format&fit=crop&w=600&q=80",d:{nl:"Mineraalwater.",en:"Mineral water.",fr:"Eau minérale.",ar:"مياه معدنية."}},
{id:"lemonade",cat:"drink",name:"Homemade Lemonade",price:"€4,50",img:"https://images.unsplash.com/photo-1523677011781-c91d1bbe2f9d?auto=format&fit=crop&w=600&q=80",d:{nl:"Huisgemaakte frisse limonade.",en:"Fresh homemade lemonade.",fr:"Limonade maison fraîche.",ar:"ليمونادة منزلية طازجة."}}
];
var lang="nl",filter="all";
function render(){var box=document.getElementById("menu");box.innerHTML="";
var q=(document.getElementById("search")?document.getElementById("search").value:"").toLowerCase();
dishes.filter(function(x){return (filter==="all"||x.cat===filter) && (x.name.toLowerCase().includes(q)||x.d[lang].toLowerCase().includes(q))}).forEach(function(x){
var b=document.createElement("button");b.type="button";b.className="dish";var tags="";
if(x.id==="chicken"||x.id==="loaded") tags='<div style="margin-top:8px;font-size:11px;color:#d5aa57">🌶️ PITTIG • 🍗 KIP</div>';
else if(x.id==="grill") tags='<div style="margin-top:8px;font-size:11px;color:#d5aa57">🍗 KIP • 🔥 GRILL</div>';
else if(x.id==="mixed") tags='<div style="margin-top:8px;font-size:11px;color:#d5aa57">🔥 MIXED GRILL</div>';
else if(x.id==="cheesy") tags='<div style="margin-top:8px;font-size:11px;color:#d5aa57">🥬 VEGETARISCH*</div>';
b.innerHTML='<div><div class="name">'+x.name+'</div><div class="price">'+x.price+'</div><div class="desc">'+x.d[lang]+'</div>'+tags+'</div><img src="'+x.img+'" alt="">';
b.addEventListener("click",function(){openDish(x)});box.appendChild(b);});}
function openDish(x){document.getElementById("big").src=x.img;document.getElementById("dn").textContent=x.name;document.getElementById("dp").textContent=x.price;document.getElementById("dd").textContent=x.d[lang];document.getElementById("warn").textContent=lang==="ar"?"⚠️ تحقق دائمًا من مسببات الحساسية مع الموظف.":"⚠️ Allergeneninformatie is demo-data. Controleer allergieën altijd bij een medewerker.";document.getElementById("overlay").style.display="flex";}
document.getElementById("close").addEventListener("click",function(){document.getElementById("overlay").style.display="none"});
document.getElementById("overlay").addEventListener("click",function(e){if(e.target===this)this.style.display="none"});
document.querySelectorAll(".lang").forEach(function(b){b.addEventListener("click",function(){document.querySelectorAll(".lang").forEach(function(z){z.classList.remove("active")});b.classList.add("active");lang=b.dataset.lang;document.body.classList.toggle("rtl",lang==="ar");render();updateAILanguage();});});
document.querySelectorAll(".filter").forEach(function(b){b.addEventListener("click",function(){document.querySelectorAll(".filter").forEach(function(z){z.classList.remove("active")});b.classList.add("active");filter=b.dataset.filter;render();});});
document.getElementById("ai").addEventListener("click",function(){document.getElementById("overlay").style.display="none";document.getElementById("aiOverlay").style.display="flex"});
document.getElementById("search").addEventListener("input",render);
var aiO=document.getElementById("aiOverlay");
document.getElementById("novaFloat").addEventListener("click",function(){aiO.style.display="flex"});
document.getElementById("aiClose").addEventListener("click",function(){aiO.style.display="none"});
function euro(s){return parseFloat(s.replace("€","").replace(",","."));}

var aiText={
 nl:{intro:"Vraag iets over het menu.",chicken:"🍗 Kip",budget:"💶 Onder €20",spicy:"🌶️ Pittig",placeholder:"Typ je vraag...",
 hello:"Hoi! Probeer: “Ik heb €20 en wil kip.”",allergy:"⚠️ Voor allergieën doe ik geen aannames. Vraag een medewerker om de actuele allergeneninformatie te bevestigen.",
 none:"Ik vind geen gerecht dat aan al deze wensen voldoet. Probeer een hoger budget of minder filters.",within:"Binnen",fits:"passen",onlyChicken:"Ik heb alleen kipopties binnen je budget meegenomen.",cheapest:"De goedkoopste passende keuze is",combo:"Binnen {b} past bijvoorbeeld {m} + {d} voor {t}.",noCombo:"Ik vind met deze voorkeuren geen maaltijd + drankje binnen dat budget."},
 en:{intro:"Ask me anything about the menu.",chicken:"🍗 Chicken",budget:"💶 Under €20",spicy:"🌶️ Spicy",placeholder:"Type your question...",
 hello:"Hi! Try: “I have €20 and want chicken.”",allergy:"⚠️ I don't guess about allergies. Please ask a staff member to confirm the current allergen information.",
 none:"I couldn't find a dish matching all those preferences. Try a higher budget or fewer filters.",within:"Within",fits:"you can choose",onlyChicken:"I only included chicken options within your budget.",cheapest:"The cheapest matching option is",combo:"Within {b}, you could have {m} + {d} for {t}.",noCombo:"I couldn't find a meal + drink matching those preferences within your budget."},
 fr:{intro:"Posez une question sur le menu.",chicken:"🍗 Poulet",budget:"💶 Moins de 20 €",spicy:"🌶️ Épicé",placeholder:"Écrivez votre question...",
 hello:"Bonjour ! Essayez : « J’ai 20 € et je veux du poulet. »",allergy:"⚠️ Pour les allergies, je ne fais aucune supposition. Demandez à un membre du personnel de confirmer les allergènes.",
 none:"Je ne trouve aucun plat correspondant à tous ces critères. Essayez un budget plus élevé ou moins de filtres.",within:"Avec",fits:"vous pouvez choisir",onlyChicken:"J’ai uniquement inclus les plats au poulet dans votre budget.",cheapest:"L’option correspondante la moins chère est",combo:"Avec {b}, vous pouvez prendre {m} + {d} pour {t}.",noCombo:"Je ne trouve pas de repas + boisson correspondant à ces critères dans votre budget."},
 ar:{intro:"اسألني عن قائمة الطعام.",chicken:"🍗 دجاج",budget:"💶 أقل من 20€",spicy:"🌶️ حار",placeholder:"اكتب سؤالك...",
 hello:"مرحباً! جرّب: «معي 20 يورو وأريد دجاج»",allergy:"⚠️ لا أخمّن معلومات الحساسية. يرجى سؤال أحد الموظفين لتأكيد معلومات مسببات الحساسية الحالية.",
 none:"لم أجد طبقاً يطابق كل هذه الخيارات. جرّب ميزانية أعلى أو شروطاً أقل.",within:"ضمن",fits:"يمكنك اختيار",onlyChicken:"أدرجت فقط خيارات الدجاج ضمن ميزانيتك.",cheapest:"أرخص خيار مناسب هو",combo:"ضمن {b} يمكنك اختيار {m} + {d} مقابل {t}.",noCombo:"لم أجد وجبة مع مشروب تطابق هذه الخيارات ضمن ميزانيتك."}
};

function normalizeArabicDigits(x){
 var map={"٠":"0","١":"1","٢":"2","٣":"3","٤":"4","٥":"5","٦":"6","٧":"7","٨":"8","٩":"9","٫":"."};
 return x.replace(/[٠-٩٫]/g,function(c){return map[c]||c});
}
function hasAny(q,words){return words.some(function(w){return q.indexOf(w)>-1})}
function smartAsk(raw){
 var q=normalizeArabicDigits((raw||"").toLowerCase().trim());
 var T=aiText[lang]||aiText.nl;
 var budgetMatch=q.match(/(?:€\s*)?(\d+(?:[.,]\d{1,2})?)\s*(?:euro|euros|€|يورو)?/);
 var budget=budgetMatch?parseFloat(budgetMatch[1].replace(",",".")):null;

 var wantsChicken=hasAny(q,["kip","chicken","poulet","دجاج","فراخ"]);
 var wantsSpicy=hasAny(q,["pitt","spicy","hot","épic","epic","حار","حارة"]);
 var wantsDrink=hasAny(q,["drank","drinken","drink","boisson","cola","lemonade","مشروب","شراب","كولا"]);
 var wantsCheap=hasAny(q,["goedkoop","goedkoopste","cheap","cheapest","moins cher","le moins cher","رخيص","ارخص","أرخص"]);
 var noBeef=hasAny(q,["geen rund","geen beef","zonder rund","no beef","without beef","sans boeuf","sans bœuf","بدون لحم بقري","لا أريد لحم بقري"]);
 var allergy=hasAny(q,["allerg","noten","melk","gluten","allergy","nuts","milk","allergie","noix","lait","حساسية","مكسرات","حليب","غلوتين"]);

 var items=dishes.slice();
 if(wantsChicken) items=items.filter(function(x){return ["chicken","grill","mixed","loaded"].includes(x.id)});
 if(wantsSpicy) items=items.filter(function(x){return ["chicken","loaded"].includes(x.id)});
 if(noBeef) items=items.filter(function(x){return !["smash","truffle","mixed","steak"].includes(x.id)});
 if(budget!==null) items=items.filter(function(x){return euro(x.price)<=budget});
 items.sort(function(a,b){return euro(a.price)-euro(b.price)});

 var a="";
 if(allergy){
   a=T.allergy;
 } else if(wantsDrink && budget!==null){
   var drinks=[{n:"Spa Blauw",p:2.75},{n:"Coca-Cola",p:3.25},{n:"Fanta",p:3.25},{n:"Homemade Lemonade",p:4.50}];
   var meals=items.filter(function(x){return x.cat!=="drink"});
   var combos=[];
   meals.forEach(function(m){drinks.forEach(function(d){if(euro(m.price)+d.p<=budget) combos.push({m:m,d:d,total:euro(m.price)+d.p})})});
   combos.sort(function(a,b){return b.total-a.total});
   if(combos.length){
     var c=combos[0];
     a=T.combo.replace("{b}","€"+budget.toFixed(2).replace(".",",")).replace("{m}",c.m.name).replace("{d}",c.d.n).replace("{t}","€"+c.total.toFixed(2).replace(".",","));
   } else a=T.noCombo;
 } else if(items.length){
   if(wantsCheap){
     var x=items[0]; a=T.cheapest+" "+x.name+" ("+x.price+").";
   } else {
     var shown=items.slice(0,4);
     if(lang==="ar"){
       a=(budget!==null?T.within+" €"+budget.toFixed(2).replace(".",",")+" ":"")+T.fits+": "+shown.map(function(x){return x.name+" ("+x.price+")"}).join("، ")+".";
     } else if(lang==="fr"){
       a=(budget!==null?T.within+" "+budget.toFixed(2).replace(".",",")+" € ":"")+T.fits+" : "+shown.map(function(x){return x.name+" ("+x.price+")"}).join(", ")+".";
     } else {
       a=(budget!==null?T.within+" €"+budget.toFixed(2).replace(".",",")+" ":"")+T.fits+": "+shown.map(function(x){return x.name+" ("+x.price+")"}).join(", ")+".";
     }
     if(wantsChicken&&budget!==null) a+=" "+T.onlyChicken;
   }
 } else a=T.none;
 document.getElementById("aiAnswer").textContent=a;
}

function updateAILanguage(){
 var T=aiText[lang]||aiText.nl;
 document.getElementById("aiIntro").textContent=T.intro;
 document.getElementById("qChicken").textContent=T.chicken;
 document.getElementById("qBudget").textContent=T.budget;
 document.getElementById("qSpicy").textContent=T.spicy;
 document.getElementById("aiQ").placeholder=T.placeholder;
 document.getElementById("aiAnswer").textContent=T.hello;
 document.getElementById("aiOverlay").classList.toggle("rtl",lang==="ar");
}

var novaHistory=[];
async function askRealNOVA(question){
  question=(question||"").trim();
  if(!question)return;
  var box=document.getElementById("aiAnswer");
  box.textContent=lang==="ar"?"يفكر NOVA...":lang==="fr"?"NOVA réfléchit...":lang==="en"?"NOVA is thinking...":"NOVA denkt na...";
  try{
    var res=await fetch("/.netlify/functions/ai",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:question,language:lang,history:novaHistory.slice(-6)})
    });
    var data=await res.json();
    if(!res.ok) throw new Error(data.error||"AI error");
    box.textContent=data.answer;
    novaHistory.push({role:"user",content:question},{role:"assistant",content:data.answer});
  }catch(e){
    box.textContent=(lang==="ar"?"تعذر الاتصال بالذكاء الاصطناعي الآن. ":"NOVA AI kon nu niet verbinden. ")+"("+e.message+")";
  }
}

window.smartAsk=smartAsk;
document.getElementById("aiSend").addEventListener("click",function(){askRealNOVA(document.getElementById("aiQ").value)});
document.getElementById("aiQ").addEventListener("keydown",function(e){if(e.key==="Enter")askRealNOVA(this.value)});
render();updateAILanguage();
</script></body></html>
