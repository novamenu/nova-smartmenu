<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Menu</title>
<meta name="theme-color" content="#0b0b0c">
<style>
:root { --g: #d5aa57; --bg: #0b0b0c; --card: #171719; --muted: #aaa; --rand: #2e2e31; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: #f8f3e8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
button { font: inherit; cursor: pointer; }
header { text-align: center; padding: calc(28px + env(safe-area-inset-top)) 14px 18px; background: linear-gradient(color-mix(in srgb, var(--g) 18%, #0b0b0c), #0b0b0c); }
h1 { letter-spacing: 3px; margin: 0; font-size: 30px; text-transform: uppercase; }
h1 .accent, h2, .price { color: var(--g); }
.tag { color: var(--muted); margin: 7px; }
.langs { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-top: 15px; }
.lang, .filter { border: 1px solid #333; background: var(--card); color: #eee; border-radius: 999px; padding: 9px 12px; font-weight: bold; white-space: nowrap; }
.active { background: var(--g); color: #111; border-color: var(--g); }
main { max-width: 680px; margin: auto; padding: 10px 15px 110px; }
.kop { display: flex; justify-content: space-between; align-items: center; margin: 8px 2px 13px; }
.kop b { font-size: 18px; }
.kop small { display: block; font-size: 12px; color: #999; margin-top: 3px; }
#search { width: 100%; padding: 13px 14px; border-radius: 13px; border: 1px solid #333; background: #141416; color: #fff; margin-bottom: 12px; font-size: 16px; }
.filters { display: flex; gap: 6px; overflow: auto; margin: 8px 0 18px; padding-bottom: 4px; }
.hint { text-align: center; color: #9b9b9f; font-size: 12px; margin: 12px; }
.cat-kop { margin: 22px 2px 4px; font-size: 15px; color: var(--g); text-transform: uppercase; letter-spacing: 1px; }
.dish { width: 100%; display: grid; grid-template-columns: 1fr 95px; gap: 12px; text-align: left; background: var(--card); color: #fff; border: 1px solid var(--rand); border-radius: 16px; padding: 13px; margin: 10px 0; -webkit-tap-highlight-color: transparent; }
.dish:active { transform: scale(.98); border-color: var(--g); }
.dish.zonder-foto { grid-template-columns: 1fr; }
.dish img, .ph { width: 95px; height: 95px; object-fit: cover; border-radius: 12px; }
.ph { display: flex; align-items: center; justify-content: center; font-size: 38px; background: #222226; }
.name { font-size: 17px; font-weight: 900; }
.desc { font-size: 13px; color: var(--muted); line-height: 1.4; margin-top: 6px; }
.price { font-weight: 900; margin-top: 6px; }
.labels { margin-top: 8px; font-size: 11px; color: var(--g); letter-spacing: .3px; }
.leeg { text-align: center; color: var(--muted); padding: 40px 10px; }
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.82); z-index: 100; padding: 16px; align-items: flex-end; justify-content: center; }
.overlay.open { display: flex; }
.sheet { background: var(--card); border: 1px solid #38383c; border-radius: 22px; width: min(100%, 650px); padding: 16px; max-height: 90vh; overflow: auto; }
.sheet img { width: 100%; height: 230px; object-fit: cover; border-radius: 15px; }
.close { float: right; background: #29292d; color: #fff; border: 0; border-radius: 50%; width: 38px; height: 38px; font-weight: bold; }
.warn { background: #20190d; border: 1px solid #59441d; color: #ddc99e; padding: 11px; border-radius: 11px; font-size: 12px; margin-top: 12px; }
.ai { width: 100%; padding: 14px; background: var(--g); color: #111; border: 0; border-radius: 12px; font-weight: 900; margin-top: 10px; }
#novaFloat { position: fixed; right: 16px; bottom: calc(17px + env(safe-area-inset-bottom)); z-index: 50; border: 0; border-radius: 999px; padding: 14px 17px; background: var(--g); color: #111; font-weight: 900; box-shadow: 0 8px 28px #000; }
#aiAnswer { background: #0e0e10; border-radius: 12px; padding: 13px; min-height: 85px; line-height: 1.5; color: #ddd; white-space: pre-line; }
.ai-rij { display: flex; gap: 7px; margin-top: 10px; }
#aiQ { flex: 1; min-width: 0; padding: 12px; border-radius: 11px; border: 1px solid #333; background: #0d0d0f; color: #fff; font-size: 16px; }
.voet { text-align: center; color: #6f6f74; font-size: 12px; margin-top: 36px; }
.voet a { color: #8d8d92; }
.rtl { direction: rtl; text-align: right; }
.rtl .dish { text-align: right; }
.laden { text-align: center; color: var(--muted); padding: 60px 10px; }
</style>
<script src="config.js"></script>
</head>

  <div class="langs" id="langs"></div>

    <div class="hint" id="tHint"></div>
    <div class="filters" id="filters"></div>
    <div id="menu"></div>
  </div>
  <p class="voet" id="voet"></p>
</main>

<button id="novaFloat" hidden>✨ NOVA AI</button>

<div class="overlay" id="aiOverlay"><div class="sheet" role="dialog" aria-modal="true">
  <button class="close" id="aiClose" aria-label="Sluiten">✕</button>
  <h2>✨ NOVA AI</h2>
  <p id="aiIntro" class="desc" style="font-size:14px"></p>
  <div class="filters" id="snelVragen"></div>
  <div id="aiAnswer"></div>
  <div class="ai-rij"><input id="aiQ" maxlength="300"><button id="aiSend" class="ai" style="width:auto;margin:0" aria-label="Versturen">➤</button></div>
</div></div>

  <p class="desc" id="dd" style="font-size:15px"></p>

var $ = function (id) { return document.getElementById(id); };

var lang = 'nl', filter = 'all';

function el(tag, props, kinderen) {
  var e = document.createElement(tag);
  if (props) Object.keys(props).forEach(function (k) { e[k] = props[k]; });
  (kinderen || []).forEach(function (k) { if (k) e.append(k); });
  return e;
}
function T() { return UI[lang] || UI.nl; }
function inTaal(obj) { return (obj && (obj[lang] || obj.nl || obj.en)) || ''; }
function prijsTekst(p) { return new Intl.NumberFormat(T().locale, { style: 'currency', currency: 'EUR' }).format(Number(p) || 0); }
function heeft(g, label) { return (g.labels || []).indexOf(label) > -1; }
function catVan(g) { return categorieen.find(function (c) { return c.id === g.categorie_id; }); }
function veiligeKleur(k) { return /^#[0-9a-fA-F]{6}$/.test(k || '') ? k : '#d5aa57'; }
function veiligeFoto(url) { return /^https:\/\//.test(url || '') ? url : ''; }

/* ===================== Laden ===================== */
async function rest(pad) {
  var c = window.SMARTMENU || {};
  var res = await fetch(c.supabaseUrl + '/rest/v1/' + pad, { headers: { apikey: c.supabaseKey } });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function laad() {
  var slug = (new URLSearchParams(location.search).get('r') || '').trim().toLowerCase();
  var c = window.SMARTMENU || {};
  if (!slug || slug === 'demo' || !c.supabaseUrl || !c.supabaseKey) {
    restaurant = DEMO.restaurant; categorieen = DEMO.categorieen; gerechten = DEMO.gerechten;
    return toon();
  }
  try {
    var r = await rest('restaurants?slug=eq.' + encodeURIComponent(slug) + '&select=id,slug,naam,ondertitel,kleur,talen,ai_aan');
    if (!r.length) return foutmelding('nietGevonden');
    restaurant = r[0];
    var id = encodeURIComponent(restaurant.id);
    var res = await Promise.all([
      rest('categorieen?restaurant_id=eq.' + id + '&select=id,naam,emoji,volgorde&order=volgorde.asc'),
      rest('gerechten?restaurant_id=eq.' + id + '&beschikbaar=eq.true&select=id,categorie_id,naam,prijs,beschrijving,foto,labels,volgorde&order=volgorde.asc,naam.asc')
    ]);
    categorieen = res[0]; gerechten = res[1];
    toon();
  } catch (e) {
    console.error(e);
    foutmelding('fout');
  }
}

  var talen = (restaurant.talen && restaurant.talen.length) ? restaurant.talen.filter(function (t) { return UI[t]; }) : ['nl'];
  restaurant.talen = talen.length ? talen : ['nl'];
  var bewaard = null;
  try { bewaard = localStorage.getItem('smartmenu-taal'); } catch (e) {}
  var toestel = (navigator.language || 'nl').slice(0, 2);
  lang = [bewaard, toestel, 'nl', restaurant.talen[0]].find(function (t) { return t && restaurant.talen.indexOf(t) > -1; });
}

function foutmelding(sleutel) {
  kiesStartTaalVeilig();
  $('laden').textContent = T()[sleutel];
}
function kiesStartTaalVeilig() { var t = (navigator.language || 'nl').slice(0, 2); lang = UI[t] ? t : 'nl'; }

/* ===================== Tonen ===================== */
function toon() {
  kiesStartTaal();
  document.documentElement.style.setProperty('--g', veiligeKleur(restaurant.kleur));
  document.title = restaurant.naam;

  // Titel: laatste woord in de accentkleur, zoals het origineel ("NOVA GRILL").
  var woorden = restaurant.naam.trim().split(/\s+/);
  $('titel').replaceChildren(woorden.length > 1 ? woorden.slice(0, -1).join(' ') + ' ' : '', el('span', { className: 'accent', textContent: woorden[woorden.length - 1] }));
  $('ondertitel').textContent = restaurant.ondertitel || '';

  $('langs').replaceChildren();
  if (restaurant.talen.length > 1) restaurant.talen.forEach(function (t) {
    $('langs').append(el('button', { className: 'lang' + (t === lang ? ' active' : ''), textContent: UI[t].naam, onclick: function () { kiesTaal(t); } }));
  });

  $('novaFloat').hidden = !restaurant.ai_aan;
  $('ai').hidden = !restaurant.ai_aan;
  $('laden').hidden = true;
  $('inhoud').hidden = false;
  vertaal();
}

function kiesTaal(t) {
  lang = t;
  try { localStorage.setItem('smartmenu-taal', t); } catch (e) {}
  [].forEach.call(document.querySelectorAll('.lang'), function (b) { b.classList.toggle('active', b.textContent === UI[t].naam); });
  vertaal();
}

function vertaal() {
  var t = T();
  document.documentElement.lang = lang;
  document.body.classList.toggle('rtl', lang === 'ar');
  $('tOntdek').textContent = t.ontdek;
  $('tVers').textContent = restaurant.ai_aan ? t.vers : t.vers.split('•')[0].trim();
  $('search').placeholder = t.zoek;
  $('tHint').textContent = t.hint;
  $('ai').textContent = t.vraagGerecht;
  $('aiIntro').textContent = t.intro;
  $('aiQ').placeholder = t.typ;
  $('aiAnswer').textContent = t.hallo;
  $('voet').replaceChildren(t.voet + ' ', el('a', { href: './', textContent: 'NOVA SmartMenu' }));

  $('snelVragen').replaceChildren(
    snelKnop(t.kip, 'kip'), snelKnop(t.budget, '20'), snelKnop(t.pittig, 'pittig'), snelKnop(t.vega, 'vega')
  );
  tekenFilters();
  render();
}

function snelKnop(tekst, vraag) {
  return el('button', { className: 'filter', textContent: tekst, onclick: function () { slimAntwoord(vraag); } });
}

function tekenFilters() {
  var box = $('filters');
  box.replaceChildren();
  var gebruikt = categorieen.filter(function (c) { return gerechten.some(function (g) { return g.categorie_id === c.id; }); });
  if (gebruikt.length < 2) return;
  box.append(el('button', { className: 'filter' + (filter === 'all' ? ' active' : ''), textContent: T().alles, onclick: function () { filter = 'all'; tekenFilters(); render(); } }));
  gebruikt.forEach(function (c) {
    box.append(el('button', {
      className: 'filter' + (filter === c.id ? ' active' : ''),
      textContent: (c.emoji ? c.emoji + ' ' : '') + inTaal(c.naam),
      onclick: function () { filter = c.id; tekenFilters(); render(); }
    }));
  });
}

function labelTekst(g) {
  return (g.labels || []).filter(function (l) { return LABELS[l] && l !== 'drank'; }).map(function (l) { return LABELS[l][lang] || LABELS[l].nl; }).join(' • ');
}

function render() {
  var box = $('menu');
  box.replaceChildren();
  var q = $('search').value.toLowerCase().trim();
  var lijst = gerechten.filter(function (g) {
    return (filter === 'all' || g.categorie_id === filter) &&
      (!q || g.naam.toLowerCase().indexOf(q) > -1 || inTaal(g.beschrijving).toLowerCase().indexOf(q) > -1);
  });
  if (!lijst.length) { box.append(el('p', { className: 'leeg', textContent: T().geen })); return; }

  // Bij "Alles" groeperen we per categorie, in de volgorde van de eigenaar.
  var groepen = [];
  if (filter === 'all' && !q && categorieen.length > 1) {
    categorieen.forEach(function (c) { groepen.push({ cat: c, items: lijst.filter(function (g) { return g.categorie_id === c.id; }) }); });
    groepen.push({ cat: null, items: lijst.filter(function (g) { return !catVan(g); }) });
  } else groepen.push({ cat: null, items: lijst });

  groepen.forEach(function (gr) {
    if (!gr.items.length) return;
    if (gr.cat) box.append(el('h3', { className: 'cat-kop', textContent: (gr.cat.emoji ? gr.cat.emoji + ' ' : '') + inTaal(gr.cat.naam) }));
    gr.items.forEach(function (g) { box.append(gerechtKaart(g)); });
  });
}

function gerechtKaart(g) {
  var foto = veiligeFoto(g.foto);
  var cat = catVan(g);
  var tekst = el('div', null, [
    el('div', { className: 'name', textContent: g.naam }),
    el('div', { className: 'price', textContent: prijsTekst(g.prijs) }),
    inTaal(g.beschrijving) ? el('div', { className: 'desc', textContent: inTaal(g.beschrijving) }) : null,
    labelTekst(g) ? el('div', { className: 'labels', textContent: labelTekst(g) }) : null
  ]);
  var beeld = foto ? el('img', { src: foto, alt: '', loading: 'lazy' })
    : (cat && cat.emoji ? el('div', { className: 'ph', textContent: cat.emoji }) : null);
  var knop = el('button', { type: 'button', className: 'dish' + (beeld ? '' : ' zonder-foto'), onclick: function () { openGerecht(g); } }, [tekst, beeld]);
  return knop;
}

var huidigGerecht = null;
function openGerecht(g) {
  huidigGerecht = g;
  var foto = veiligeFoto(g.foto);
  $('big').hidden = !foto;
  if (foto) $('big').src = foto;
  $('dn').textContent = g.naam;
  $('dp').textContent = prijsTekst(g.prijs);
  $('dd').textContent = inTaal(g.beschrijving);
  $('dl').textContent = labelTekst(g);
  $('warn').textContent = T().allergie;
  $('overlay').classList.add('open');
}

/* ===================== NOVA AI ===================== */
function normaliseerCijfers(x) {
  var map = { '٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4', '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9', '٫': '.' };
  return x.replace(/[٠-٩٫]/g, function (c) { return map[c] || c; });
}
function bevat(q, woorden) { return woorden.some(function (w) { return q.indexOf(w) > -1; }); }

// Snelle antwoorden op de knopjes, zonder AI-kosten.
function slimAntwoord(ruw) {
  var t = T();
  var q = normaliseerCijfers((ruw || '').toLowerCase().trim());
  var m = q.match(/(\d+(?:[.,]\d{1,2})?)/);
  var budget = m ? parseFloat(m[1].replace(',', '.')) : null;
  var lijst = gerechten.filter(function (g) { return !heeft(g, 'drank'); });
  if (bevat(q, ['kip', 'chicken', 'poulet', 'دجاج'])) lijst = lijst.filter(function (g) { return heeft(g, 'kip'); });
  if (bevat(q, ['pitt', 'spicy', 'épic', 'حار'])) lijst = lijst.filter(function (g) { return heeft(g, 'pittig'); });
  if (bevat(q, ['vega', 'veggie', 'végé', 'نباتي'])) lijst = lijst.filter(function (g) { return heeft(g, 'vega') || heeft(g, 'vegan'); });
  if (budget !== null) lijst = lijst.filter(function (g) { return Number(g.prijs) <= budget; });
  lijst.sort(function (a, b) { return a.prijs - b.prijs; });

  var antwoord;
  if (!lijst.length) antwoord = t.none;
  else {
    var namen = lijst.slice(0, 4).map(function (g) { return g.naam + ' (' + prijsTekst(g.prijs) + ')'; }).join(lang === 'ar' ? '، ' : ', ');
    antwoord = (budget !== null ? t.within.replace('{b}', prijsTekst(budget)) : t.options) + ': ' + namen + '.';
  }
  $('aiAnswer').textContent = antwoord;
}

var aiGeschiedenis = [];
async function vraagNova(vraag) {
  vraag = (vraag || '').trim().slice(0, 300);
  if (!vraag) return;
  var box = $('aiAnswer');
  box.textContent = T().denkt;
  $('aiQ').value = '';
  try {
    var c = window.SMARTMENU || {};
    var res = await fetch(c.supabaseUrl + '/functions/v1/nova-ai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: c.supabaseKey },
      body: JSON.stringify({ actie: 'vraag', restaurant: restaurant.slug, message: vraag, language: lang, history: aiGeschiedenis.slice(-6) })
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || 'AI');
    box.textContent = data.answer;
    aiGeschiedenis.push({ role: 'user', content: vraag }, { role: 'assistant', content: data.answer });
  } catch (e) {
    console.error(e);
    box.textContent = T().geenAI;
  }
}

/* ===================== Knoppen ===================== */
function sluit(id) { $(id).classList.remove('open'); }
$('close').onclick = function () { sluit('overlay'); };
$('aiClose').onclick = function () { sluit('aiOverlay'); };
['overlay', 'aiOverlay'].forEach(function (id) { $(id).addEventListener('click', function (e) { if (e.target === this) sluit(id); }); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { sluit('overlay'); sluit('aiOverlay'); } });
$('ai').onclick = function () {
  sluit('overlay');
  $('aiOverlay').classList.add('open');
  if (huidigGerecht) $('aiQ').value = huidigGerecht.naam + ': ';
  $('aiQ').focus();
};
$('novaFloat').onclick = function () { $('aiOverlay').classList.add('open'); };
$('search').addEventListener('input', render);
$('aiSend').onclick = function () { vraagNova($('aiQ').value); };
$('aiQ').addEventListener('keydown', function (e) { if (e.key === 'Enter') vraagNova(this.value); });

laad();
</script>
